# TitanOs : réglages des pilotes du VAIO
# carte graphique NVIDIA : chargée par le bureau, une fois l'écran de démarrage affiché
blacklist nouveau
# Wi-Fi Intel 6200 : sans économie d'énergie ni coexistence Bluetooth (meilleure réception)
options iwlwifi power_save=0 led_mode=1 bt_coex_active=0
options iwldvm force_cam=1
options cfg80211 ieee80211_regdom=FR
# Ethernet Marvell : interruptions classiques (les MSI se perdent sur les VAIO)
options sky2 disable_msi=1
